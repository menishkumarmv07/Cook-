name: V1 quality checks

on:
  push:
    branches: [main]
  # Run checks for stacked feature PRs too, not only PRs whose base is main.
  pull_request:
  workflow_dispatch:

# Keep only the newest verification run for a given PR/ref. Rapid, focused V3
# commits should not run multiple full desktop/mobile E2E suites concurrently.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Install, test, lint, type-check, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: Unit tests
        run: npm test
      - name: ESLint
        run: npm run lint
      - name: TypeScript check
        run: npm run typecheck
      - name: Production build
        # Generate throwaway auth values in the shell so they are not printed as step env metadata.
        env:
          AUTH_TEST_DIAGNOSTICS: "1"
        run: |
          export OWNER_PASSWORD="$(openssl rand -hex 32)"
          export AUTH_SECRET="$(openssl rand -hex 48)"
          echo "::add-mask::$OWNER_PASSWORD"
          echo "::add-mask::$AUTH_SECRET"
          npm run build
      - name: Install Chromium for browser tests
        timeout-minutes: 5
        run: npx playwright install chromium
      - name: Owner-auth browser smoke (fast diagnostic gate)
        # Fresh, masked credentials are used only by this disposable smoke-test server.
        env:
          AUTH_TEST_DIAGNOSTICS: "1"
        run: |
          export OWNER_PASSWORD="$(openssl rand -hex 32)"
          export AUTH_SECRET="$(openssl rand -hex 48)"
          echo "::add-mask::$OWNER_PASSWORD"
          echo "::add-mask::$AUTH_SECRET"
          npx playwright test --grep "AUTH:" --workers=1
      - name: End-to-end browser tests
        # Generate and mask ephemeral credentials for this test server; never reuse in a deployment.
        env:
          AUTH_TEST_DIAGNOSTICS: "1"
        run: |
          export OWNER_PASSWORD="$(openssl rand -hex 32)"
          export AUTH_SECRET="$(openssl rand -hex 48)"
          echo "::add-mask::$OWNER_PASSWORD"
          echo "::add-mask::$AUTH_SECRET"
          npm run e2e
