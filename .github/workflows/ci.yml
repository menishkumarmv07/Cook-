name: V1 quality checks

on:
  push:
    branches: [main]
  # Run checks for stacked feature PRs too, not only PRs whose base is main.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Install, test, lint, type-check, build, and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Initialize diagnostic output and ephemeral auth config
        shell: bash
        run: |
          mkdir -p ci-diagnostics
          {
            echo "OWNER_PASSWORD=$(openssl rand -hex 24)"
            echo "AUTH_SECRET=$(openssl rand -hex 32)"
            echo "AUTH_TEST_DIAGNOSTICS=1"
          } >> "$GITHUB_ENV"

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee ci-diagnostics/npm-ci.log

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee ci-diagnostics/unit-tests.log

      - name: ESLint
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee ci-diagnostics/eslint.log

      - name: TypeScript check
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee ci-diagnostics/typecheck.log

      - name: Production build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee ci-diagnostics/production-build.log

      - name: Install Chromium for browser tests
        shell: bash
        run: |
          set -o pipefail
          npx playwright install --with-deps chromium 2>&1 | tee ci-diagnostics/playwright-install.log

      - name: Owner-auth browser smoke (fast diagnostic gate)
        shell: bash
        run: |
          set -o pipefail
          npx playwright test --grep "AUTH:" --workers=1 --reporter=list 2>&1 | tee ci-diagnostics/owner-auth-smoke.log

      - name: End-to-end browser tests
        shell: bash
        run: |
          set -o pipefail
          npm run e2e -- --reporter=list,html 2>&1 | tee ci-diagnostics/end-to-end.log

      - name: Upload diagnostic logs and browser reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v1-ci-diagnostics
          path: |
            ci-diagnostics/
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 7
