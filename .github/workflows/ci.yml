name: V1 quality checks

on:
  push:
    branches: [main]
  # Run checks for stacked feature PRs too, not only PRs whose base is main.
  pull_request:
  workflow_dispatch:

# Keep only the newest verification run for a given PR/ref. Rapid, focused V3
# commits should not run multiple full desktop/mobile E2E suites concurrently.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Install, test, lint, type-check, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: Unit tests
        run: npm test
      - name: ESLint
        run: npm run lint
      - name: TypeScript check
        run: npm run typecheck
      - name: Production build
        # Use disposable test-only values so the built middleware can be exercised in CI.
        env:
          OWNER_PASSWORD: ci-test-only-owner-password-not-for-production-2026
          AUTH_SECRET: ci-test-only-session-secret-never-use-in-production-2026
          AUTH_TEST_DIAGNOSTICS: "1"
        run: npm run build
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Owner-auth browser smoke (fast diagnostic gate)
        # Run only auth-focused browser tests first so login regressions are diagnosed quickly.
        env:
          OWNER_PASSWORD: ci-test-only-owner-password-not-for-production-2026
          AUTH_SECRET: ci-test-only-session-secret-never-use-in-production-2026
          AUTH_TEST_DIAGNOSTICS: "1"
        run: npx playwright test --grep "AUTH:" --workers=1
      - name: End-to-end browser tests
        # Disposable values used only by the CI test server. Never reuse in a deployment.
        env:
          OWNER_PASSWORD: ci-test-only-owner-password-not-for-production-2026
          AUTH_SECRET: ci-test-only-session-secret-never-use-in-production-2026
          AUTH_TEST_DIAGNOSTICS: "1"
        run: npm run e2e
