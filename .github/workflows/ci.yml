name: V1 quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Install, test, lint, type-check, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Unit tests
        run: npm test
      - name: ESLint
        run: npm run lint
      - name: TypeScript check
        run: npm run typecheck
      - name: Production build
        # Use disposable test-only values so the built middleware can be exercised in CI.
        env:
          OWNER_PASSWORD: ci-test-only-owner-password-not-for-production-2026
          AUTH_SECRET: ci-test-only-session-secret-never-use-in-production-2026
          AUTH_TEST_DIAGNOSTICS: "1"
        run: npm run build
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Owner-auth browser smoke (fast diagnostic gate)
        # Run only auth-focused browser tests first so login regressions are diagnosed quickly.
        env:
          OWNER_PASSWORD: ci-test-only-owner-password-not-for-production-2026
          AUTH_SECRET: ci-test-only-session-secret-never-use-in-production-2026
          AUTH_TEST_DIAGNOSTICS: "1"
        run: npx playwright test --grep "AUTH:" --workers=1
      - name: End-to-end browser tests
        # Disposable values used only by the CI test server. Never reuse in a deployment.
        env:
          OWNER_PASSWORD: ci-test-only-owner-password-not-for-production-2026
          AUTH_SECRET: ci-test-only-session-secret-never-use-in-production-2026
          AUTH_TEST_DIAGNOSTICS: "1"
        run: npm run e2e
  pin_lockfile:
    if: github.event_name == 'pull_request' && github.head_ref == 'build/npm-lockfile-2026-10-12'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate lockfile without running package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile to this PR branch
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already up to date"
            exit 0
          fi
          git commit -m "build: add reproducible npm dependency lockfile"
          git push origin "HEAD:${BRANCH_NAME}"
